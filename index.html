<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tekno Activa</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    /* =========================
       ENCABEZADO
    ========================= */

    header{
      background:#111;
      color:#fff;
      padding:16px 20px;
      text-align:center;
    }

    .logo{
      max-width:230px;
      max-height:70px;
      object-fit:contain;
    }

    .logo-texto{
      color:#fff;
      font-size:30px;
      font-weight:800;
      letter-spacing:1px;
    }

    /* =========================
       BANNER
    ========================= */

    .banner-container{
      position:relative;
      width:calc(100% - 30px);
      max-width:1200px;
      height:390px;
      margin:22px auto 35px;
      border-radius:20px;
      overflow:hidden;
      background:#111;
      box-shadow:0 8px 25px rgba(0,0,0,.15);
    }

    .banner-slider{
      width:100%;
      height:100%;
    }

    .banner-slider a{
      display:block;
      width:100%;
      height:100%;
      position:relative;
      color:#fff;
      text-decoration:none;
    }

    .banner-slider img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .banner-texto{
      position:absolute;
      left:0;
      right:0;
      bottom:0;
      padding:70px 40px 35px;
      color:#fff;
      background:linear-gradient(
        transparent,
        rgba(0,0,0,.85)
      );
    }

    .banner-texto h2{
      font-size:38px;
      margin-bottom:7px;
    }

    .banner-texto p{
      font-size:18px;
    }

    .banner-prev,
    .banner-next{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      border:none;
      background:rgba(0,0,0,.55);
      color:#fff;
      width:45px;
      height:45px;
      border-radius:50%;
      font-size:30px;
      cursor:pointer;
      z-index:5;
    }

    .banner-prev{
      left:18px;
    }

    .banner-next{
      right:18px;
    }

    .banner-dots{
      position:absolute;
      bottom:13px;
      left:0;
      right:0;
      text-align:center;
      z-index:6;
    }

    .banner-dots button{
      width:9px;
      height:9px;
      border:none;
      border-radius:50%;
      margin:0 4px;
      padding:0;
      background:#fff;
      opacity:.5;
      cursor:pointer;
    }

    .banner-dots button.activo{
      opacity:1;
      transform:scale(1.3);
    }

    /* =========================
       CONTENEDOR
    ========================= */

    .contenedor{
      max-width:1200px;
      margin:auto;
      padding:0 20px 55px;
    }

    .titulo-seccion{
      text-align:center;
      margin-bottom:25px;
    }

    .titulo-seccion h1{
      font-size:30px;
      margin-bottom:7px;
    }

    .titulo-seccion p{
      color:#777;
    }

    /* =========================
       BENEFICIOS
    ========================= */

    .beneficios{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:15px;
      margin-bottom:35px;
    }

    .beneficio{
      background:#fff;
      border-radius:15px;
      padding:20px 12px;
      text-align:center;
      box-shadow:0 3px 12px rgba(0,0,0,.06);
    }

    .beneficio-icono{
      font-size:27px;
      margin-bottom:8px;
    }

    .beneficio strong{
      display:block;
      margin-bottom:5px;
    }

    .beneficio span{
      color:#777;
      font-size:13px;
    }

    /* =========================
       BARRA
    ========================= */

    .barra{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:25px;
      flex-wrap:wrap;
    }

    .categorias{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .categorias button,
    .admin-btn{
      border:1px solid #ddd;
      background:#fff;
      padding:11px 16px;
      border-radius:25px;
      cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      transition:.2s;
    }

    .categorias button:hover,
    .categorias button.activo,
    .admin-btn:hover{
      background:#111;
      color:#fff;
      border-color:#111;
    }

    .admin-btn{
      background:#111;
      color:#fff;
    }

    /* =========================
       PRODUCTOS
    ========================= */

    .productos{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:20px;
    }

    .producto{
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 4px 15px rgba(0,0,0,.07);
      transition:.2s;
    }

    .producto:hover{
      transform:translateY(-4px);
      box-shadow:0 9px 22px rgba(0,0,0,.12);
    }

    .producto img{
      width:100%;
      height:230px;
      object-fit:contain;
      padding:18px;
      background:#fff;
    }

    .producto-info{
      padding:16px;
    }

    .producto h3{
      margin-bottom:8px;
      font-size:18px;
    }

    .producto p{
      color:#666;
      font-size:14px;
      min-height:38px;
      line-height:1.4;
    }

    .oferta{
      display:inline-block;
      background:#e53935;
      color:#fff;
      padding:5px 9px;
      border-radius:6px;
      font-size:11px;
      font-weight:bold;
      margin-bottom:8px;
    }

    .precio-anterior{
      color:#888;
      text-decoration:line-through;
      font-size:14px;
      margin-top:10px;
    }

    .precio{
      font-size:23px;
      font-weight:bold;
      margin:5px 0 12px;
    }

    .agregar{
      width:100%;
      border:none;
      background:#111;
      color:#fff;
      padding:12px;
      border-radius:8px;
      cursor:pointer;
      font-size:15px;
      font-weight:bold;
    }

    .agregar:hover{
      background:#333;
    }

    /* =========================
       CARRITO
    ========================= */

    .carrito-btn{
      position:fixed;
      right:20px;
      bottom:20px;
      background:#25D366;
      color:#fff;
      border:none;
      border-radius:50px;
      padding:15px 20px;
      font-weight:bold;
      cursor:pointer;
      z-index:50;
      box-shadow:0 5px 18px rgba(0,0,0,.2);
    }

    .carrito-btn span{
      background:#fff;
      color:#25D366;
      border-radius:50%;
      padding:3px 7px;
      margin-left:5px;
    }

    /* =========================
       MODALES
    ========================= */

    .modal{
      display:none;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.68);
      z-index:100;
      padding:20px;
      overflow-y:auto;
    }

    .modal-contenido{
      background:#fff;
      max-width:500px;
      margin:30px auto;
      padding:24px;
      border-radius:16px;
      max-height:90vh;
      overflow-y:auto;
      box-shadow:0 15px 40px rgba(0,0,0,.25);
    }

    .modal-contenido h2{
      margin-bottom:20px;
    }

    input,
    select,
    textarea{
      width:100%;
      padding:11px;
      margin:7px 0 12px;
      border:1px solid #ccc;
      border-radius:8px;
    }

    textarea{
      min-height:80px;
      resize:vertical;
    }

    .guardar{
      width:100%;
      border:none;
      background:#111;
      color:#fff;
      padding:13px;
      border-radius:8px;
      cursor:pointer;
      font-weight:bold;
    }

    .cerrar{
      width:100%;
      border:none;
      background:#ddd;
      padding:12px;
      border-radius:8px;
      margin-top:10px;
      cursor:pointer;
    }

    /* =========================
       CARRITO INTERNO
    ========================= */

    .item-carrito{
      border-bottom:1px solid #ddd;
      padding:12px 0;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    .cantidad{
      display:flex;
      align-items:center;
      gap:7px;
    }

    .cantidad button{
      border:none;
      background:#111;
      color:#fff;
      width:28px;
      height:28px;
      border-radius:50%;
      cursor:pointer;
    }

    .eliminar{
      border:none;
      background:#e53935;
      color:#fff;
      padding:6px;
      border-radius:6px;
      cursor:pointer;
    }

    .total{
      text-align:right;
      font-size:23px;
      font-weight:bold;
      margin:20px 0;
    }

    .whatsapp{
      width:100%;
      border:none;
      background:#25D366;
      color:#fff;
      padding:14px;
      border-radius:8px;
      font-size:16px;
      font-weight:bold;
      cursor:pointer;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-estado{
      background:#e8f5e9;
      padding:10px;
      border-radius:8px;
      margin-bottom:15px;
      color:#2e7d32;
      font-weight:bold;
    }

    .logout{
      width:100%;
      border:none;
      background:#e53935;
      color:#fff;
      padding:12px;
      border-radius:8px;
      cursor:pointer;
      margin-top:10px;
    }

    .error{
      background:#ffebee;
      color:#c62828;
      padding:10px;
      border-radius:8px;
      margin-bottom:10px;
      display:none;
    }

    .exito{
      background:#e8f5e9;
      color:#2e7d32;
      padding:10px;
      border-radius:8px;
      margin-bottom:10px;
      display:none;
    }

    .admin-lista{
      margin-top:20px;
    }

    .admin-producto{
      border:1px solid #ddd;
      border-radius:10px;
      padding:12px;
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .admin-producto button{
      border:none;
      background:#e53935;
      color:#fff;
      padding:8px 10px;
      border-radius:7px;
      cursor:pointer;
    }

    /* =========================
       FORMAS DE PAGO
    ========================= */

    .pagos{
      background:#111;
      color:#fff;
      padding:45px 20px;
      text-align:center;
    }

    .pagos h2{
      font-size:28px;
      margin-bottom:8px;
    }

    .pagos p{
      color:#bbb;
      margin-bottom:25px;
    }

    .pagos-grid{
      max-width:1000px;
      margin:auto;
      display:flex;
      justify-content:center;
      gap:15px;
      flex-wrap:wrap;
    }

    .pago{
      min-width:150px;
      background:#1d1d1d;
      border:1px solid #333;
      border-radius:12px;
      padding:18px;
    }

    .pago strong{
      display:block;
      margin-top:7px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer{
      background:#090909;
      color:#999;
      text-align:center;
      padding:35px 20px;
    }

    .footer-logo{
      color:#fff;
      font-size:23px;
      font-weight:bold;
      margin-bottom:10px;
    }

    .footer-links{
      display:flex;
      justify-content:center;
      gap:20px;
      flex-wrap:wrap;
      margin:18px 0;
      color:#bbb;
    }

    /* =========================
       CELULAR
    ========================= */

    @media(max-width:1000px){

      .productos{
        grid-template-columns:repeat(3,1fr);
      }

      .beneficios{
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:700px){

      .banner-container{
        height:230px;
        margin:15px 10px 25px;
        width:calc(100% - 20px);
      }

      .banner-texto{
        padding:50px 20px 25px;
      }

      .banner-texto h2{
        font-size:22px;
      }

      .banner-texto p{
        font-size:13px;
      }

      .contenedor{
        padding:0 12px 45px;
      }

      .productos{
        grid-template-columns:repeat(2,1fr);
        gap:12px;
      }

      .producto img{
        height:170px;
        padding:12px;
      }

      .producto-info{
        padding:12px;
      }

      .producto h3{
        font-size:16px;
      }

      .producto p{
        font-size:12px;
      }

      .precio{
        font-size:20px;
      }

      .beneficios{
        gap:10px;
      }

      .beneficio{
        padding:15px 8px;
      }

      .barra{
        align-items:flex-start;
      }

      .admin-btn{
        width:100%;
      }

      .carrito-btn{
        right:12px;
        bottom:12px;
      }
    }
  </style>
</head>

<body>

<!-- =========================
     LOGO
========================= -->

<header>

  <img
    class="logo"
    src=""
    alt="Tekno Activa"
    id="logoImagen"
    style="display:none;"
  >

  <div
    class="logo-texto"
    id="logoTexto">
    TEKNO ACTIVA
  </div>

</header>


<!-- =========================
     BANNER
========================= -->

<div class="banner-container">

  <div
    id="bannerSlider"
    class="banner-slider">
  </div>

  <button
    class="banner-prev"
    onclick="bannerAnterior()">
    ‹
  </button>

  <button
    class="banner-next"
    onclick="bannerSiguiente()">
    ›
  </button>

  <div
