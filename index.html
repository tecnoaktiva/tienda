<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tekno Activa</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 34px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    .contenedor {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .categorias {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .categorias button,
    .admin-btn {
      border: none;
      background: white;
      padding: 11px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px #ddd;
    }

    .categorias button:hover,
    .admin-btn:hover {
      background: #111;
      color: white;
    }

    .productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .producto {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px #ddd;
    }

    .producto img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 15px;
      background: white;
    }

    .producto-info {
      padding: 15px;
    }

    .producto h3 {
      margin-bottom: 8px;
    }

    .producto p {
      color: #666;
      font-size: 14px;
    }

    .oferta {
      display: inline-block;
      background: #e53935;
      color: white;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .precio-anterior {
      color: #888;
      text-decoration: line-through;
      font-size: 14px;
      margin-top: 10px;
    }

    .precio {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0 12px;
    }

    .agregar {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .agregar:hover {
      background: #333;
    }

    .carrito-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 15px 20px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .carrito-btn span {
      background: white;
      color: #25D366;
      border-radius: 50%;
      padding: 3px 7px;
      margin-left: 5px;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.65);
      z-index: 20;
      padding: 20px;
    }

    .modal-contenido {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-contenido h2 {
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .guardar {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cerrar {
      width: 100%;
      border: none;
      background: #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .item-carrito {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .cantidad button {
      border: none;
      background: #111;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }

    .eliminar {
      border: none;
      background: #e53935;
      color: white;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-size: 23px;
      font-weight: bold;
      margin: 20px 0;
    }

    .whatsapp {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #777;
    }

  </style>
</head>

<body>

<header>
  <h1>TEKNO ACTIVA</h1>
  <p>Tecnología, hogar y belleza</p>
</header>


<div class="contenedor">

  <div class="barra">

    <div class="categorias">

      <button onclick="filtrar('todos')">
        🛍️ Todos
      </button>

      <button onclick="filtrar('auriculares')">
        🎧 Auriculares
      </button>

      <button onclick="filtrar('cargadores')">
        🔌 Cargadores
      </button>

      <button onclick="filtrar('hogar')">
        🏠 Hogar
      </button>

      <button onclick="filtrar('belleza')">
        💄 Belleza
      </button>

    </div>


    <button class="admin-btn" onclick="abrirAdmin()">
      ⚙️ Administrar
    </button>

  </div>


  <div
    id="productos"
    class="productos"
  ></div>

</div>


<!-- CARRITO -->

<button
  class="carrito-btn"
  onclick="abrirCarrito()"
>
  🛒 Carrito
  <span id="contador">0</span>
</button>


<div
  class="modal"
  id="modalCarrito"
>

  <div class="modal-contenido">

    <h2>🛒 Tu carrito</h2>

    <div id="listaCarrito"></div>

    <div class="total">
      Total: $<span id="total">0</span>
    </div>

    <button
      class="whatsapp"
      onclick="enviarWhatsApp()"
    >
      📲 Enviar pedido por WhatsApp
    </button>

    <button
      class="cerrar"
      onclick="cerrarCarrito()"
    >
      Cerrar
    </button>

  </div>

</div>


<!-- ADMINISTRACIÓN -->

<div
  class="modal"
  id="modalAdmin"
>

  <div class="modal-contenido">

    <h2>⚙️ Agregar producto</h2>


    <label>Nombre</label>

    <input
      id="nombre"
      type="text"
      placeholder="Ej: Auricular A6S"
    >


    <label>Precio</label>

    <input
      id="precio"
      type="number"
      placeholder="9999"
    >


    <label>Precio anterior</label>

    <input
      id="precioAnterior"
      type="number"
      placeholder="11500"
    >


    <label>Categoría</label>

    <select id="categoria">

      <option value="auriculares">
        Auriculares
      </option>

      <option value="cargadores">
        Cargadores
      </option>

      <option value="hogar">
        Hogar
      </option>

      <option value="belleza">
        Belleza
      </option>

    </select>


    <label>Descripción</label>

    <textarea
      id="descripcion"
      placeholder="Descripción del producto"
    ></textarea>


    <label>URL de imagen</label>

    <input
      id="imagen"
      type="text"
      placeholder="https://..."
    >


    <button
      class="guardar"
      onclick="guardarProducto()"
    >
      ➕ Guardar producto
    </button>


    <button
      class="cerrar"
      onclick="cerrarAdmin()"
    >
      Cerrar
    </button>

  </div>

</div>


<footer>
  © 2026 Tekno Activa
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://emjknuwvbvqonafckwce.supabase.co"

const SUPABASE_KEY =
  "sb_publishable_qGD8gkIwNPEBhmnzl6OIBg_uUQiPQhG";

/* =========================
   PRODUCTOS
========================= */

let productos = [];


async function cargarProductos() {

  try {

    const respuesta = await fetch(
      SUPABASE_URL +
      "/rest/v1/productos?select=*",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudieron cargar los productos"
      );

    }


    productos =
      await respuesta.json();


    mostrarProductos(productos);


  } catch (error) {

    console.error(error);

    document.getElementById(
      "productos"
    ).innerHTML =
      "<p>No se pudieron cargar los productos.</p>";

  }

}


function mostrarProductos(lista) {

  const contenedor =
    document.getElementById("productos");

  contenedor.innerHTML = "";


  lista.forEach(producto => {

    const tieneOferta =
      producto.precio_anterior &&
      Number(producto.precio_anterior) >
      Number(producto.precio);


    contenedor.innerHTML += `

      <div
        class="producto"
        data-categoria="${producto.categoria}"
      >

        <img
          src="${
            producto.imagen ||
            'https://via.placeholder.com/500x500?text=Producto'
          }"
          alt="${producto.nombre}"
        >


        <div class="producto-info">

          ${
            tieneOferta
            ? '<span class="oferta">🔥 OFERTA</span>'
            : ''
          }


          <h3>
            ${producto.nombre}
          </h3>


          <p>
            ${producto.descripcion || ""}
          </p>


          ${
            tieneOferta
            ? `
              <div class="precio-anterior">
                $${Number(
                  producto.precio_anterior
                ).toLocaleString("es-AR")}
              </div>
            `
            : ""
          }


          <div class="precio">
            $${Number(
              producto.precio
            ).toLocaleString("es-AR")}
          </div>


          <button
            class="agregar"
            onclick="agregarCarrito(
              '${producto.nombre.replace(
                /'/g,
                "\\'"
              )}',
              ${producto.precio}
            )"
          >
            🛒 Agregar al carrito
          </button>

        </div>

      </div>

    `;

  });

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto() {

  const nombre =
    document.getElementById(
      "nombre"
    ).value.trim();


  const precio =
    Number(
      document.getElementById(
        "precio"
      ).value
    );


  const precioAnterior =
    Number(
      document.getElementById(
        "precioAnterior"
      ).value
    ) || null;


  const categoria =
    document.getElementById(
      "categoria"
    ).value;


  const descripcion =
    document.getElementById(
      "descripcion"
    ).value.trim();


  const imagen =
    document.getElementById(
      "imagen"
    ).value.trim();


  if (!nombre || !precio) {

    alert(
      "Completá el nombre y el precio."
    );

    return;

  }


  try {

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/productos",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },


          body:
            JSON.stringify({

              nombre:
                nombre,

              precio:
                precio,

              precio_anterior:
                precioAnterior,

              categoria:
                categoria,

              descripcion:
                descripcion,

              imagen:
                imagen

            })

        }
      );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();

      console.error(
        "Supabase:",
        error
      );

      alert(
        "No se pudo guardar:\n\n" +
        error
      );

      return;

    }


    alert(
      "✅ Producto guardado."
    );


    document.getElementById(
      "nombre"
    ).value = "";


    document.getElementById(
      "precio"
    ).value = "";


    document.getElementById(
      "precioAnterior"
    ).value = "";


    document.getElementById(
      "descripcion"
    ).value = "";


    document.getElementById(
      "imagen"
    ).value = "";


    cerrarAdmin();


    cargarProductos();


  } catch (error) {

    console.error(
      "ERROR COMPLETO:",
      error
    );

    alert(
      "ERROR: " +
      error.message
    );

  }

}


/* =========================
   FILTROS
========================= */

function filtrar(categoria) {

  if (categoria === "todos") {

    mostrarProductos(
      productos
    );

    return;

  }


  const filtrados =
    productos.filter(
      producto =>
        producto.categoria ===
        categoria
    );


  mostrarProductos(
    filtrados
  );

}


/* =========================
   CARRITO
========================= */

let carrito = [];


function agregarCarrito(
  nombre,
  precio
) {

  const producto =
    carrito.find(
      item =>
        item.nombre ===
        nombre
    );


  if (producto) {

    producto.cantidad++;

  } else {

    carrito.push({

      nombre:
        nombre,

      precio:
        Number(precio),

      cantidad:
        1

    });

  }


  actualizarCarrito();


  alert(
    "Producto agregado 🛒"
  );

}


function actualizarCarrito() {

  const lista =
    document.getElementById(
      "listaCarrito"
    );


  lista.innerHTML = "";


  let total = 0;

  let cantidadTotal = 0;


  carrito.forEach(
    (item, index) => {

      const subtotal =
        item.precio *
        item.cantidad;


      total +=
        subtotal;


      cantidadTotal +=
        item.cantidad;


      lista.innerHTML += `

        <div class="item-carrito">

          <div>

            <strong>
              ${item.nombre}
            </strong>

            <br>

            $${item.precio.toLocaleString(
              "es-AR"
            )}

          </div>


          <div class="cantidad">

            <button
              onclick="cambiarCantidad(
                ${index},
                -1
              )"
            >
              -
            </button>


            ${item.cantidad}


            <button
              onclick="cambiarCantidad(
                ${index},
                1
              )"
            >
              +
            </button>

          </div>


          <button
            class="eliminar"
            onclick="eliminarProducto(
              ${index}
            )"
          >
            🗑️
          </button>

        </div>

      `;

    }
  );


  document.getElementById(
    "total"
  ).textContent =
    total.toLocaleString(
      "es-AR"
    );


  document.getElementById(
    "contador"
  ).textContent =
    cantidadTotal;

}


function cambiarCantidad(
  index,
  cambio
) {

  carrito[index].cantidad +=
    cambio;


  if (
    carrito[index].cantidad <=
    0
  ) {

    carrito.splice(
      index,
      1
    );

  }


  actualizarCarrito();

}


function eliminarProducto(
  index
) {

  carrito.splice(
    index,
    1
  );


  actualizarCarrito();

}


function abrirCarrito() {

  document.getElementById(
    "modalCarrito"
  ).style.display =
    "block";


  actualizarCarrito();

}


function cerrarCarrito() {

  document.getElementById(
    "modalCarrito"
  ).style.display =
    "none";

}


/* =========================
   WHATSAPP
========================= */

function enviarWhatsApp() {

  if (
    carrito.length ===
    0
  ) {

    alert(
      "El carrito está vacío."
    );

    return;

  }


  let mensaje =
    "Hola Tekno Activa! 👋%0A%0A";


  mensaje +=
    "Quiero realizar este pedido:%0A%0A";


  let total = 0;


  carrito.forEach(
    item => {

      const subtotal =
        item.precio *
        item.cantidad;


      total +=
        subtotal;


      mensaje +=
        "📦 " +
        item.nombre +
        " x" +
        item.cantidad +
        " - $" +
        subtotal.toLocaleString(
          "es-AR"
        ) +
        "%0A";

    }
  );


  mensaje +=
    "%0A💰 TOTAL: $" +
    total.toLocaleString(
      "es-AR"
    );


  window.open(
    "https://wa.me/5492646181163?text=" +
    mensaje,
    "_blank"
  );

}


/* =========================
   MODALES
========================= */

function abrirAdmin() {

  document.getElementById(
    "modalAdmin"
  ).style.display =
    "block";

}


function cerrarAdmin() {

  document.getElementById(
    "modalAdmin"
  ).style.display =
    "none";

}


/* =========================
   INICIO
========================= */

cargarProductos();

</script>

</body>
</html>
