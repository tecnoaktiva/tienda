<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tekno Activa</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 34px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    /* =========================
       BANNER
    ========================= */

    .banner-container {
      position: relative;
      max-width: 1100px;
      height: 320px;
      margin: 20px auto 30px;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 4px 15px #ccc;
    }

    .banner-slider {
      width: 100%;
      height: 100%;
    }

    .banner-slider a {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      color: white;
      text-decoration: none;
    }

    .banner-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-texto {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 25px;
      color: white;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, .75)
      );
    }

    .banner-texto h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .banner-texto p {
      font-size: 16px;
    }

    .banner-prev,
    .banner-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, .55);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 30px;
      cursor: pointer;
      z-index: 5;
    }

    .banner-prev {
      left: 15px;
    }

    .banner-next {
      right: 15px;
    }

    .banner-dots {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 6;
    }

    .banner-dots button {
      width: 9px;
      height: 9px;
      border: none;
      border-radius: 50%;
      margin: 0 4px;
      padding: 0;
      background: white;
      opacity: .5;
      cursor: pointer;
    }

    .banner-dots button.activo {
      opacity: 1;
      transform: scale(1.3);
    }

    /* =========================
       CONTENEDOR
    ========================= */

    .contenedor {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .categorias {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .categorias button,
    .admin-btn {
      border: none;
      background: white;
      padding: 11px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px #ddd;
    }

    .categorias button:hover,
    .admin-btn:hover {
      background: #111;
      color: white;
    }

    /* =========================
       PRODUCTOS
    ========================= */

    .productos {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .producto {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px #ddd;
    }

    .producto img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 15px;
      background: white;
    }

    .producto-info {
      padding: 15px;
    }

    .producto h3 {
      margin-bottom: 8px;
    }

    .producto p {
      color: #666;
      font-size: 14px;
      min-height: 20px;
    }

    .oferta {
      display: inline-block;
      background: #e53935;
      color: white;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .precio-anterior {
      color: #888;
      text-decoration: line-through;
      font-size: 14px;
      margin-top: 10px;
    }

    .precio {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0 12px;
    }

    .agregar {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .agregar:hover {
      background: #333;
    }

    /* =========================
       CARRITO
    ========================= */

    .carrito-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 15px 20px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .carrito-btn span {
      background: white;
      color: #25D366;
      border-radius: 50%;
      padding: 3px 7px;
      margin-left: 5px;
    }

    /* =========================
       MODALES
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 20;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-contenido {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-contenido h2 {
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .guardar {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cerrar {
      width: 100%;
      border: none;
      background: #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .cerrar:hover {
      background: #ccc;
    }

    /* =========================
       CARRITO INTERNO
    ========================= */

    .item-carrito {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .cantidad {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .cantidad button {
      border: none;
      background: #111;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }

    .eliminar {
      border: none;
      background: #e53935;
      color: white;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-size: 23px;
      font-weight: bold;
      margin: 20px 0;
    }

    .whatsapp {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       ADMIN
    ========================= */

    .admin-estado {
      background: #e8f5e9;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      color: #2e7d32;
      font-weight: bold;
    }

    .logout {
      width: 100%;
      border: none;
      background: #e53935;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }

    .error {
      background: #ffebee;
      color: #c62828;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
    }

    .exito {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: none;
    }

    .admin-lista {
      margin-top: 20px;
    }

    .admin-producto {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .admin-producto button {
      border: none;
      background: #e53935;
      color: white;
      padding: 8px 10px;
      border-radius: 7px;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      header h1 {
        font-size: 28px;
      }

      .banner-container {
        height: 210px;
        margin: 15px 10px 25px;
      }

      .banner-texto {
        padding: 15px;
      }

      .banner-texto h2 {
        font-size: 20px;
      }

      .banner-texto p {
        font-size: 13px;
      }

      .banner-prev,
      .banner-next {
        width: 36px;
        height: 36px;
        font-size: 25px;
      }

      .carrito-btn {
        right: 12px;
        bottom: 12px;
      }

      .item-carrito {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>TEKNO ACTIVA</h1>
  <p>Tecnología, hogar y belleza</p>
</header>

<!-- =========================
     BANNER
========================= -->

<div class="banner-container">

  <div
    id="bannerSlider"

  </div>

  <button

<!-- =========================

<button

</button>

<div

      Cerrar

    </button>

  </div>

</div>

<!-- =========================
     LOGIN ADMIN
========================= -->

<div
  class="modal"
  id="modalLogin">

  <div class="modal-contenido">

    <h2>🔐 Administrador</h2>

    <p style="margin-bottom:15px;">
      Ingresá con tu cuenta de administrador.
    </p>

    <div
      id="loginError"

    </div>

    <label>Email</label>

    <input

  </div>

</div>

<!-- =========================
     ADMINISTRACIÓN
========================= -->

<div

  id="modalAdmin">

  <div class="modal-contenido">

    <h2>⚙️ Administrar Tekno Activa</h2>

    <div class="admin-estado">

    </div>

    <hr>

    <h3 style="margin:20px 0 10px;">

    </h3>

    <div

    <label>URL de imagen</label>

    <button

    <hr style="margin:25px 0;">

      id="bannerEnlace"
      type="text"
      placeholder="https://...">

      class="guardar"
      onclick="guardarBanner()">

      🖼️ Guardar banner

    </button>

    <hr style="margin:25px 0;">

    <h3 style="margin-bottom:10px;">
      📋 Productos actuales
    </h3>

    <div
      id="adminLista"
      class="admin-lista">
    </div>

      class="logout"

<footer>

<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

  /* =========================
     CONFIGURACIÓN SUPABASE
  ========================= */

  const SUPABASE_URL =
    "https://emjknuwvbvqonafckwce.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_qGD8gkIwNPEBhmnzl6OIBg_uUQiPQhG";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     VARIABLES
  ========================= */

  let productos = [];

  let banners = [];

  let bannerActual = 0;

  let bannerInterval;

  let carrito = [];


  /* =========================
     SESIÓN
  ========================= */

  async function verificarSesion() {

    const {
      data: {
        session
      }
    } =
      await supabaseClient.auth.getSession();

    return session;
  }


  /* =========================
     ABRIR ADMIN
  ========================= */

  async function abrirAdmin() {

    const session =
      await verificarSesion();

    if (!session) {

      document.getElementById(
        "modalLogin"
      ).style.display = "block";

      return;
    }

    document.getElementById(
      "modalAdmin"
    ).style.display = "block";

    cargarListaAdmin();
  }


  /* =========================
     CERRAR ADMIN
  ========================= */

  function cerrarAdmin() {

    document.getElementById(
      "modalAdmin"
    ).style.display = "none";

  }


  /* =========================
     LOGIN
  ========================= */

  async function iniciarSesion() {

    const email =
      document.getElementById(
        "loginEmail"
      ).value.trim();

    const password =
      document.getElementById(
        "loginPassword"
      ).value;

    const errorBox =
      document.getElementById(
        "loginError"
      );

    errorBox.style.display = "none";

    if (!email || !password) {

      errorBox.textContent =
        "Completá el email y la contraseña.";

      errorBox.style.display = "block";

      return;
    }

    const {
      data,
      error
    } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      console.error(error);

      errorBox.textContent =
        "Email o contraseña incorrectos.";

      errorBox.style.display = "block";

      return;
    }

    if (data.session) {

      document.getElementById(
        "modalLogin"
      ).style.display = "none";

      document.getElementById(
        "loginPassword"
      ).value = "";

      document.getElementById(
        "modalAdmin"
      ).style.display = "block";

      cargarListaAdmin();

    }

  }


  /* =========================
     CERRAR LOGIN
  ========================= */

  function cerrarLogin() {

    document.getElementById(
      "modalLogin"
    ).style.display = "none";

    document.getElementById(
      "loginError"
    ).style.display = "none";

  }


  /* =========================
     CERRAR SESIÓN
  ========================= */

  async function cerrarSesion() {

    await supabaseClient.auth.signOut();

    cerrarAdmin();

    alert("🔒 Sesión cerrada.");

  }


  /* =========================
     CARGAR PRODUCTOS
  ========================= */

  async function cargarProductos() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("productos")
          .select("*")
          .order("id", {
            ascending: true
          });

      if (error) {
        throw error;
      }

      productos = data || [];

      mostrarProductos(productos);

    } catch (error) {

      console.error(
        "Error productos:",
        error
      );

      document.getElementById(
        "productos"
      ).innerHTML =
        "<p>No se pudieron cargar los productos.</p>";

    }

  }


  /* =========================
     MOSTRAR PRODUCTOS
  ========================= */

  function mostrarProductos(lista) {

    const contenedor =
      document.getElementById(
        "productos"
      );

    contenedor.innerHTML = "";

    if (!lista.length) {

      contenedor.innerHTML =
        "<p>No hay productos cargados todavía.</p>";

      return;
    }

    lista.forEach(producto => {

      const tieneOferta =
        producto.precio_anterior &&
        Number(producto.precio_anterior) >
        Number(producto.precio);

      const imagen =
        producto.imagen ||
        "https://via.placeholder.com/500x500?text=Producto";

      const nombreSeguro =
        String(producto.nombre)
          .replace(/\\/g, "\\\\")
          .replace(/'/g, "\\'");

      contenedor.innerHTML += `

        <div
          class="producto"
          data-categoria="${producto.categoria || ""}"
        >

          <img
            src="${imagen}"
            alt="${escapeHTML(producto.nombre)}"
          >

          <div class="producto-info">

            ${
              tieneOferta
                ? `
                  <span class="oferta">
                    🔥 OFERTA
                  </span>
                `
                : ""
            }

            <h3>
              ${escapeHTML(producto.nombre)}
            </h3>

            <p>
              ${escapeHTML(producto.descripcion || "")}
            </p>

            ${
              tieneOferta
                ? `
                  <div class="precio-anterior">
                    $${Number(
                      producto.precio_anterior
                    ).toLocaleString("es-AR")}
                  </div>
                `
                : ""
            }

            <div class="precio">
              $${Number(
                producto.precio
              ).toLocaleString("es-AR")}
            </div>

            <button
              class="agregar"
              onclick="agregarCarrito(
                '${nombreSeguro}',
                ${Number(producto.precio)}
              )">

              🛒 Agregar al carrito

            </button>

          </div>

        </div>

      `;

    });

  }


  /* =========================
     ESCAPAR HTML
  ========================= */

  function escapeHTML(text) {

    return String(text)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  /* =========================
     GUARDAR PRODUCTO
  ========================= */

  async function guardarProducto() {

    const nombre =
      document.getElementById(
        "nombre"
      ).value.trim();

    const precio =
      Number(
        document.getElementById(
          "precio"
        ).value
      );

    const precioAnteriorValor =
      document.getElementById(
        "precioAnterior"
      ).value;

    const precioAnterior =
      precioAnteriorValor
        ? Number(precioAnteriorValor)
        : null;

    const categoria =
      document.getElementById(
        "categoria"
      ).value;

    const descripcion =
      document.getElementById(
        "descripcion"
      ).value.trim();

    const imagen =
      document.getElementById(
        "imagen"
      ).value.trim();

    const errorBox =
      document.getElementById(
        "productoError"
      );

    const exitoBox =
      document.getElementById(
        "productoExito"
      );

    errorBox.style.display = "none";
    exitoBox.style.display = "none";

    if (!nombre || !precio) {

      errorBox.textContent =
        "Completá el nombre y el precio.";

      errorBox.style.display = "block";

      return;
    }

    const session =
      await verificarSesion();

    if (!session) {

      errorBox.textContent =
        "Tu sesión expiró. Volvé a iniciar sesión.";

      errorBox.style.display = "block";

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("productos")
        .insert({

          nombre: nombre,

          precio: precio,

          precio_anterior:
            precioAnterior,

          categoria: categoria,

          descripcion: descripcion,

          imagen: imagen

        });

    if (error) {

      console.error(error);

      errorBox.textContent =
        "No se pudo guardar el producto: " +
        error.message;

      errorBox.style.display = "block";

      return;
    }

    exitoBox.textContent =
      "✅ Producto guardado correctamente.";

    exitoBox.style.display = "block";

    document.getElementById(
      "nombre"
    ).value = "";

    document.getElementById(
      "precio"
    ).value = "";

    document.getElementById(
      "precioAnterior"
    ).value = "";

    document.getElementById(
      "descripcion"
    ).value = "";

    document.getElementById(
      "imagen"
    ).value = "";

    await cargarProductos();

    await cargarListaAdmin();

  }


  /* =========================
     LISTA ADMIN
  ========================= */

  async function cargarListaAdmin() {

    const lista =
      document.getElementById(
        "adminLista"
      );

    lista.innerHTML =
      "Cargando...";

    const {
      data,
      error
    } =
      await supabaseClient
        .from("productos")
        .select("*")
        .order("id", {
          ascending: false
        });

    if (error) {

      lista.innerHTML =
        "No se pudieron cargar los productos.";

      console.error(error);

      return;
    }

    if (!data.length) {

      lista.innerHTML =
        "No hay productos.";

      return;
    }

    lista.innerHTML = "";

    data.forEach(producto => {

      lista.innerHTML += `

        <div class="admin-producto">

          <div>

            <strong>
              ${escapeHTML(producto.nombre)}
            </strong>

            <br>

            $${Number(
              producto.precio
            ).toLocaleString("es-AR")}

          </div>

          <button
            onclick="eliminarProductoAdmin(${producto.id})">

            🗑️ Eliminar

          </button>

        </div>

      `;

    });

  }


  /* =========================
     ELIMINAR PRODUCTO
  ========================= */

  async function eliminarProductoAdmin(id) {

    const confirmar =
      confirm(
        "¿Seguro que querés eliminar este producto?"
      );

    if (!confirmar) {
      return;
    }

    const session =
      await verificarSesion();

    if (!session) {

      alert(
        "Tu sesión expiró."
      );

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("productos")
        .delete()
        .eq("id", id);

    if (error) {

      console.error(error);

      alert(
        "No se pudo eliminar: " +
        error.message
      );

      return;
    }

    alert(
      "🗑️ Producto eliminado."
    );

    await cargarProductos();

    await cargarListaAdmin();

  }


  /* =========================
     CARGAR BANNERS
  ========================= */

  async function cargarBanners() {

    try {

      const {
        data,
        error
      } =
        await supabaseClient
          .from("banners")
          .select("*")
          .eq("activo", true)
          .order("id", {
            ascending: true
          });

      if (error) {
        throw error;
      }

      banners = data || [];

      bannerActual = 0;

      mostrarBanner();

    } catch (error) {

      console.error(
        "Error banners:",
        error
      );

    }

  }


  /* =========================
     MOSTRAR BANNER
  ========================= */

  function mostrarBanner() {

    const slider =
      document.getElementById(
        "bannerSlider"
      );

    const dots =
      document.getElementById(
        "bannerDots"
      );

    if (!slider || !dots) {
      return;
    }

    if (!banners.length) {

      slider.innerHTML = "";

      dots.innerHTML = "";

      clearInterval(
        bannerInterval
      );

      return;
    }

    const banner =
      banners[bannerActual];

    const enlace =
      banner.enlace || "#";

    slider.innerHTML = `

      <a
        href="${escapeHTML(enlace)}"
        ${
          banner.enlace
            ? 'target="_blank" rel="noopener noreferrer"'
            : ""
        }
      >

        <img
          src="${escapeHTML(banner.imagen)}"
          alt="${escapeHTML(
            banner.titulo ||
            "Banner Tekno Activa"
          )}"
        >

        ${
          banner.titulo ||
          banner.texto
            ? `
              <div class="banner-texto">

                ${
                  banner.titulo
                    ? `
                      <h2>
                        ${escapeHTML(
                          banner.titulo
                        )}
                      </h2>
                    `
                    : ""
                }

                ${
                  banner.texto
                    ? `
                      <p>
                        ${escapeHTML(
                          banner.texto
                        )}
                      </p>
                    `
                    : ""
                }

              </div>
            `
            : ""
        }

      </a>

    `;

    dots.innerHTML =
      banners.map(
        (_, index) => `

          <button
            class="${
              index === bannerActual
                ? "activo"
                : ""
            }"
            onclick="irABanner(${index})">
          </button>

        `
      ).join("");

    clearInterval(
      bannerInterval
    );

    if (banners.length > 1) {

      bannerInterval =
        setInterval(
          bannerSiguiente,
          5000
        );

    }

  }


  /* =========================
     SIGUIENTE BANNER
  ========================= */

  function bannerSiguiente() {

    if (!banners.length) {
      return;
    }

    bannerActual =
      (bannerActual + 1) %
      banners.length;

    mostrarBanner();

  }


  /* =========================
     ANTERIOR BANNER
  ========================= */

  function bannerAnterior() {

    if (!banners.length) {
      return;
    }

    bannerActual =
      (bannerActual - 1 +
        banners.length) %
      banners.length;

    mostrarBanner();

  }


  /* =========================
     IR A BANNER
  ========================= */

  function irABanner(index) {

    bannerActual = index;

    mostrarBanner();

  }


  /* =========================
     GUARDAR BANNER
  ========================= */

  async function guardarBanner() {

    const imagen =
      document.getElementById(
        "bannerImagen"
      ).value.trim();

    const titulo =
      document.getElementById(
        "bannerTitulo"
      ).value.trim();

    const texto =
      document.getElementById(
        "bannerTexto"
      ).value.trim();

    const enlace =
      document.getElementById(
        "bannerEnlace"
      ).value.trim();

    const errorBox =
      document.getElementById(
        "bannerError"
      );

    const exitoBox =
      document.getElementById(
        "bannerExito"
      );

    errorBox.style.display = "none";
    exitoBox.style.display = "none";

    if (!imagen) {

      errorBox.textContent =
        "Ingresá la URL de la imagen.";

      errorBox.style.display =
        "block";

      return;
    }

    const session =
      await verificarSesion();

    if (!session) {

      errorBox.textContent =
        "Tu sesión expiró.";

      errorBox.style.display =
        "block";

      return;
    }

    const {
      error
    } =
      await supabaseClient
        .from("banners")
        .insert({

          imagen: imagen,

          titulo: titulo,

          texto: texto,

          enlace: enlace || null,

          activo: true

        });

    if (error) {

      console.error(error);

      errorBox.textContent =
        "No se pudo guardar el banner: " +
        error.message;

      errorBox.style.display =
        "block";

      return;
    }

    exitoBox.textContent =
      "✅ Banner guardado correctamente.";

    exitoBox.style.display =
      "block";

    document.getElementById(
      "bannerImagen"
    ).value = "";

    document.getElementById(
      "bannerTitulo"
    ).value = "";

    document.getElementById(
      "bannerTexto"
    ).value = "";

    document.getElementById(
      "bannerEnlace"
    ).value = "";

    await cargarBanners();

  }


  /* =========================
     FILTROS
  ========================= */

  function filtrar(categoria) {

    if (categoria === "todos") {

      mostrarProductos(
        productos
      );

      return;
    }

    const filtrados =
      productos.filter(
        producto =>
          producto.categoria ===
          categoria
      );

    mostrarProductos(
      filtrados
    );

  }


  /* =========================
     AGREGAR AL CARRITO
  ========================= */

  function agregarCarrito(
    nombre,
    precio
  ) {

    const producto =
      carrito.find(
        item =>
          item.nombre ===
          nombre
      );

    if (producto) {

      producto.cantidad++;

    } else {

      carrito.push({

        nombre: nombre,

        precio: Number(precio),

        cantidad: 1

      });

    }

    actualizarCarrito();

    alert(
      "Producto agregado 🛒"
    );

  }


  /* =========================
     ACTUALIZAR CARRITO
  ========================= */

  function actualizarCarrito() {

    const lista =
      document.getElementById(
        "listaCarrito"
      );

    lista.innerHTML = "";

    let total = 0;

    let cantidadTotal = 0;

    carrito.forEach(
      (item, index) => {

        const subtotal =
          item.precio *
          item.cantidad;

        total += subtotal;

        cantidadTotal +=
          item.cantidad;

        lista.innerHTML += `

          <div class="item-carrito">

            <div>

              <strong>
                ${escapeHTML(item.nombre)}
              </strong>

              <br>

              $${item.precio.toLocaleString(
                "es-AR"
              )}

            </div>

            <div class="cantidad">

              <button
                onclick="cambiarCantidad(
                  ${index},
                  -1
                )">
                −
              </button>

              ${item.cantidad}

              <button
                onclick="cambiarCantidad(
                  ${index},
                  1
                )">
                +
              </button>

            </div>

            <button
              class="eliminar"
              onclick="eliminarDelCarrito(
                ${index}
              )">

              🗑️

            </button>

          </div>

        `;

      }
    );

    document.getElementById(
      "total"
    ).textContent =
      total.toLocaleString(
        "es-AR"
      );

    document.getElementById(
      "contador"
    ).textContent =
      cantidadTotal;

  }


  /* =========================
     CAMBIAR CANTIDAD
  ========================= */

  function cambiarCantidad(
    index,
    cambio
  ) {

    carrito[index].cantidad +=
      cambio;

    if (
      carrito[index].cantidad <=
      0
    ) {

      carrito.splice(
        index,
        1
      );

    }

    actualizarCarrito();

  }


  /* =========================
     ELIMINAR DEL CARRITO
  ========================= */

  function eliminarDelCarrito(
    index
  ) {

    carrito.splice(
      index,
      1
    );

    actualizarCarrito();

  }


  /* =========================
     ABRIR CARRITO
  ========================= */

  function abrirCarrito() {

    document.getElementById(
      "modalCarrito"
    ).style.display =
      "block";

    actualizarCarrito();

  }


  /* =========================
     CERRAR CARRITO
  ========================= */

  function cerrarCarrito() {

    document.getElementById(
      "modalCarrito"
    ).style.display =
      "none";

  }


  /* =========================
     WHATSAPP
  ========================= */

  function enviarWhatsApp() {

    if (
      carrito.length === 0
    ) {

      alert(
        "El carrito está vacío."
      );

      return;
    }

    let mensaje =
      "Hola Tekno Activa! 👋\n\n";

    mensaje +=
      "Quiero realizar este pedido:\n\n";

    let total = 0;

    carrito.forEach(
      item => {

        const subtotal =
          item.precio *
          item.cantidad;

        total += subtotal;

        mensaje +=
          "📦 " +
          item.nombre +
          " x" +
          item.cantidad +
          " - $" +
          subtotal.toLocaleString(
            "es-AR"
          ) +
          "\n";

      }
    );

    mensaje +=
      "\n💰 TOTAL: $" +
      total.toLocaleString(
        "es-AR"
      );

    window.open(
      "https://wa.me/5492646181163?text=" +
      encodeURIComponent(mensaje),
      "_blank"
    );

  }


  /* =========================
     INICIO
  ========================= */

  cargarProductos();

  cargarBanners();

</script>

</body>
