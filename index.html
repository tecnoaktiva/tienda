<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tekno Activa</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    header h1 {
      font-size: 34px;
    }

    header p {
      margin-top: 8px;
      color: #ccc;
    }

    /* =========================
       BANNER
    ========================= */

    .banner-container {
      position: relative;
      max-width: 1100px;
      height: 320px;
      margin: 20px auto 30px;
      border-radius: 18px;
      overflow: hidden;
      background: #111;
      box-shadow: 0 4px 15px #ccc;
    }

    .banner-slider {
      width: 100%;
      height: 100%;
    }

    .banner-slider a {
      display: block;
      width: 100%;
      height: 100%;
      position: relative;
      color: white;
      text-decoration: none;
    }

    .banner-slider img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .banner-texto {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 25px;
      color: white;
      background: linear-gradient(
        transparent,
        rgba(0, 0, 0, .75)
      );
    }

    .banner-texto h2 {
      font-size: 28px;
      margin-bottom: 5px;
    }

    .banner-texto p {
      font-size: 16px;
    }

    .banner-prev,
    .banner-next {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: rgba(0, 0, 0, .55);
      color: white;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 30px;
      cursor: pointer;
      z-index: 5;
    }

    .banner-prev {
      left: 15px;
    }

    .banner-next {
      right: 15px;
    }

    .banner-dots {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 6;
    }

    .banner-dots button {
      width: 9px;
      height: 9px;
      border: none;
      border-radius: 50%;
      margin: 0 4px;
      padding: 0;
      background: white;
      opacity: .5;
      cursor: pointer;
    }

    .banner-dots button.activo {
      opacity: 1;
      transform: scale(1.3);
    }

    /* =========================
       CONTENEDOR
    ========================= */

    .contenedor {
      max-width: 1100px;
      margin: auto;
      padding: 25px 15px;
    }

    .barra {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .categorias {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .categorias button,
    .admin-btn {
      border: none;
      background: white;
      padding: 11px 16px;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 2px 8px #ddd;
    }

    .categorias button:hover,
    .admin-btn:hover {
      background: #111;
      color: white;
    }

    /* =========================
       PRODUCTOS
    ========================= */

    .productos {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .producto {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px #ddd;
    }

    .producto img {
      width: 100%;
      height: 220px;
      object-fit: contain;
      padding: 15px;
      background: white;
    }

    .producto-info {
      padding: 15px;
    }

    .producto h3 {
      margin-bottom: 8px;
    }

    .producto p {
      color: #666;
      font-size: 14px;
    }

    .oferta {
      display: inline-block;
      background: #e53935;
      color: white;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .precio-anterior {
      color: #888;
      text-decoration: line-through;
      font-size: 14px;
      margin-top: 10px;
    }

    .precio {
      font-size: 22px;
      font-weight: bold;
      margin: 5px 0 12px;
    }

    .agregar {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .agregar:hover {
      background: #333;
    }

    /* =========================
       CARRITO
    ========================= */

    .carrito-btn {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 50px;
      padding: 15px 20px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .carrito-btn span {
      background: white;
      color: #25D366;
      border-radius: 50%;
      padding: 3px 7px;
      margin-left: 5px;
    }

    /* =========================
       MODALES
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .65);
      z-index: 20;
      padding: 20px;
    }

    .modal-contenido {
      background: white;
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-contenido h2 {
      margin-bottom: 20px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px;
      margin: 7px 0 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    .guardar {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 13px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .cerrar {
      width: 100%;
      border: none;
      background: #ddd;
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }

    .item-carrito {
      border-bottom: 1px solid #ddd;
      padding: 12px 0;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .cantidad button {
      border: none;
      background: #111;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
    }

    .eliminar {
      border: none;
      background: #e53935;
      color: white;
      padding: 6px;
      border-radius: 6px;
      cursor: pointer;
    }

    .total {
      text-align: right;
      font-size: 23px;
      font-weight: bold;
      margin: 20px 0;
    }

    .whatsapp {
      width: 100%;
      border: none;
      background: #25D366;
      color: white;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    footer {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    /* =========================
       CELULAR
    ========================= */

    @media (max-width: 600px) {

      .banner-container {
        height: 210px;
        margin: 15px 10px 25px;
      }

      .banner-texto {
        padding: 15px;
      }

      .banner-texto h2 {
        font-size: 20px;
      }

      .banner-texto p {
        font-size: 13px;
      }

      .banner-prev,
      .banner-next {
        width: 36px;
        height: 36px;
        font-size: 25px;
      }

    }

  </style>
</head>

<body>

<header>
  <h1>TEKNO ACTIVA</h1>
  <p>Tecnología, hogar y belleza</p>
</header>

<!-- =========================
     BANNER
========================= -->

<div class="banner-container">

  <div
    id="bannerSlider"
    class="banner-slider">
  </div>

  <button
    class="banner-prev"
    onclick="bannerAnterior()">
    ‹
  </button>

  <button
    class="banner-next"
    onclick="bannerSiguiente()">
    ›
  </button>

  <div
    id="bannerDots"
    class="banner-dots">
  </div>

</div>


<div class="contenedor">

  <div class="barra">

    <div class="categorias">

      <button onclick="filtrar('todos')">
        🛍️ Todos
      </button>

      <button onclick="filtrar('auriculares')">
        🎧 Auriculares
      </button>

      <button onclick="filtrar('cargadores')">
        🔌 Cargadores
      </button>

      <button onclick="filtrar('hogar')">
        🏠 Hogar
      </button>

      <button onclick="filtrar('belleza')">
        💄 Belleza
      </button>

    </div>

    <button
      class="admin-btn"
      onclick="abrirAdmin()">
      ⚙️ Administrar
    </button>

  </div>


  <div
    id="productos"
    class="productos">
  </div>

</div>


<!-- =========================
     CARRITO
========================= -->

<button
  class="carrito-btn"
  onclick="abrirCarrito()">

  🛒 Carrito

  <span id="contador">0</span>

</button>


<div
  class="modal"
  id="modalCarrito">

  <div class="modal-contenido">

    <h2>🛒 Tu carrito</h2>

    <div id="listaCarrito"></div>

    <div class="total">
      Total: $<span id="total">0</span>
    </div>

    <button
      class="whatsapp"
      onclick="enviarWhatsApp()">

      📲 Enviar pedido por WhatsApp

    </button>

    <button
      class="cerrar"
      onclick="cerrarCarrito()">

      Cerrar

    </button>

  </div>

</div>


<!-- =========================
     ADMINISTRACIÓN
========================= -->

<div
  class="modal"
  id="modalAdmin">

  <div class="modal-contenido">

    <h2>⚙️ Administrar Tekno Activa</h2>

<hr>

<h3>📦 Agregar producto</h3>

    <label>Nombre</label>

    <input
      id="nombre"
      type="text"
      placeholder="Ej: Auricular A6S">


    <label>Precio</label>

    <input
      id="precio"
      type="number"
      placeholder="9999">


    <label>Precio anterior</label>

    <input
      id="precioAnterior"
      type="number"
      placeholder="11500">


    <label>Categoría</label>

    <select id="categoria">

      <option value="auriculares">
        Auriculares
      </option>

      <option value="cargadores">
        Cargadores
      </option>

      <option value="hogar">
        Hogar
      </option>

      <option value="belleza">
        Belleza
      </option>

    </select>


    <label>Descripción</label>

    <textarea
      id="descripcion"
      placeholder="Descripción del producto">
    </textarea>


    <label>URL de imagen</label>

    <input
      id="imagen"
      type="text"
      placeholder="https://...">


    <button
      class="guardar"
      onclick="guardarProducto()">

      ➕ Guardar producto

    </button>

<hr style="margin:25px 0;">

<h3>🖼️ Agregar banner</h3>

<label>URL de imagen</label>

<input
  id="bannerImagen"
  type="text"
  placeholder="https://...">

<label>Título</label>

<input
  id="bannerTitulo"
  type="text"
  placeholder="Ej: ¡Ofertas de la semana!">

<label>Texto</label>

<input
  id="bannerTexto"
  type="text"
  placeholder="Ej: Hasta 30% de descuento">

<label>Enlace opcional</label>

<input
  id="bannerEnlace"
  type="text"
  placeholder="https://...">

<button
  class="guardar"
  onclick="guardarBanner()">

  🖼️ Guardar banner

</button>
    <button
      class="cerrar"
      onclick="cerrarAdmin()">

      Cerrar

    </button>

  </div>

</div>


<footer>
  © 2026 Tekno Activa
</footer>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://emjknuwvbvqonafckwce.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_qGD8gkIwNPEBhmnzl6OIBg_uUQiPQhG";


/* =========================
   PRODUCTOS
========================= */

let productos = [];


/* =========================
   BANNERS
========================= */

let banners = [];

let bannerActual = 0;

let bannerInterval;


/* =========================
   CARGAR BANNERS
========================= */

async function cargarBanners() {

  try {

    const respuesta = await fetch(
      SUPABASE_URL +
      "/rest/v1/banners?select=*&activo=eq.true&order=id.asc",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization":
            "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!respuesta.ok) {

      throw new Error(
        "No se pudieron cargar los banners"
      );

    }

    banners =
      await respuesta.json();

    mostrarBanner();

  } catch (error) {

    console.error(
      "Error banners:",
      error
    );

  }

}


/* =========================
   MOSTRAR BANNER
========================= */

function mostrarBanner() {

  const slider =
    document.getElementById(
      "bannerSlider"
    );

  const dots =
    document.getElementById(
      "bannerDots"
    );

  if (!slider || !dots) {
    return;
  }

  if (banners.length === 0) {

    slider.innerHTML = "";

    dots.innerHTML = "";

    return;
  }

  const banner =
    banners[bannerActual];


  slider.innerHTML = `

    <a
      href="${banner.enlace || '#'}"
      ${banner.enlace
        ? 'target="_blank"'
        : ''}
    >

      <img
        src="${banner.imagen}"
        alt="${banner.titulo || 'Banner Tekno Activa'}"
      >

      ${
        banner.titulo ||
        banner.texto
        ? `

          <div class="banner-texto">

            ${
              banner.titulo
              ? `<h2>${banner.titulo}</h2>`
              : ""
            }

            ${
              banner.texto
              ? `<p>${banner.texto}</p>`
              : ""
            }

          </div>

        `
        : ""
      }

    </a>

  `;


  dots.innerHTML =
    banners.map(
      (_, index) => `

        <button
          class="${
            index === bannerActual
            ? "activo"
            : ""
          }"
          onclick="irABanner(${index})">
        </button>

      `
    ).join("");


  clearInterval(
    bannerInterval
  );


  if (banners.length > 1) {

    bannerInterval =
      setInterval(
        bannerSiguiente,
        5000
      );

  }

}


/* =========================
   BANNER SIGUIENTE
========================= */

function bannerSiguiente() {

  if (banners.length === 0) {
    return;
  }

  bannerActual =
    (bannerActual + 1) %
    banners.length;

  mostrarBanner();

}


/* =========================
   BANNER ANTERIOR
========================= */

function bannerAnterior() {

  if (banners.length === 0) {
    return;
  }

  bannerActual =
    (bannerActual - 1 +
      banners.length) %
    banners.length;

  mostrarBanner();

}


/* =========================
   IR A BANNER
========================= */

function irABanner(index) {

  bannerActual = index;

  mostrarBanner();

}


/* =========================
   CARGAR PRODUCTOS
========================= */

async function cargarProductos() {

  try {

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/productos?select=*",
        {
          headers: {
            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY
          }
        }
      );


    if (!respuesta.ok) {

      throw new Error(
        "No se pudieron cargar los productos"
      );

    }


    productos =
      await respuesta.json();


    mostrarProductos(
      productos
    );


  } catch (error) {

    console.error(error);

    document.getElementById(
      "productos"
    ).innerHTML =
      "<p>No se pudieron cargar los productos.</p>";

  }

}


/* =========================
   MOSTRAR PRODUCTOS
========================= */

function mostrarProductos(lista) {

  const contenedor =
    document.getElementById(
      "productos"
    );

  contenedor.innerHTML = "";


  lista.forEach(
    producto => {

      const tieneOferta =
        producto.precio_anterior &&
        Number(
          producto.precio_anterior
        ) >
        Number(
          producto.precio
        );


      contenedor.innerHTML += `

        <div
          class="producto"
          data-categoria="${producto.categoria}"
        >

          <img
            src="${
              producto.imagen ||
              "https://via.placeholder.com/500x500?text=Producto"
            }"
            alt="${producto.nombre}"
          >


          <div class="producto-info">

            ${
              tieneOferta
              ? `
                <span class="oferta">
                  🔥 OFERTA
                </span>
              `
              : ""
            }


            <h3>
              ${producto.nombre}
            </h3>


            <p>
              ${producto.descripcion || ""}
            </p>


            ${
              tieneOferta
              ? `

                <div class="precio-anterior">

                  $${Number(
                    producto.precio_anterior
                  ).toLocaleString("es-AR")}

                </div>

              `
              : ""
            }


            <div class="precio">

              $${Number(
                producto.precio
              ).toLocaleString("es-AR")}

            </div>


            <button
              class="agregar"
              onclick="agregarCarrito(
                '${String(
                  producto.nombre
                ).replace(
                  /'/g,
                  "\\'"
                )}',
                ${producto.precio}
              )">

              🛒 Agregar al carrito

            </button>

          </div>

        </div>

      `;

    }
  );

}


/* =========================
   GUARDAR PRODUCTO
========================= */

async function guardarProducto() {

  const nombre =
    document.getElementById(
      "nombre"
    ).value.trim();


  const precio =
    Number(
      document.getElementById(
        "precio"
      ).value
    );


  const precioAnterior =
    Number(
      document.getElementById(
        "precioAnterior"
      ).value
    ) || null;


  const categoria =
    document.getElementById(
      "categoria"
    ).value;


  const descripcion =
    document.getElementById(
      "descripcion"
    ).value.trim();


  const imagen =
    document.getElementById(
      "imagen"
    ).value.trim();


  if (!nombre || !precio) {

    alert(
      "Completá el nombre y el precio."
    );

    return;

  }


  try {

    const respuesta =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/productos",
        {

          method: "POST",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY,

            "Content-Type":
              "application/json",

            "Prefer":
              "return=minimal"

          },

          body:
            JSON.stringify({

              nombre:
                nombre,

              precio:
                precio,

              precio_anterior:
                precioAnterior,

              categoria:
                categoria,

              descripcion:
                descripcion,

              imagen:
                imagen

            })

        }
      );


    if (!respuesta.ok) {

      const error =
        await respuesta.text();

      console.error(
        "Supabase:",
        error
      );

      alert(
        "No se pudo guardar:\n\n" +
        error
      );

      return;

    }


    alert(
      "✅ Producto guardado."
    );


    document.getElementById(
      "nombre"
    ).value = "";

    document.getElementById(
      "precio"
    ).value = "";

    document.getElementById(
      "precioAnterior"
    ).value = "";

    document.getElementById(
      "descripcion"
    ).value = "";

    document.getElementById(
      "imagen"
    ).value = "";


    cerrarAdmin();


    cargarProductos();


  } catch (error) {

    console.error(
      "ERROR COMPLETO:",
      error
    );

    alert(
      "ERROR: " +
      error.message
    );

  }

}


/* =========================
   FILTROS
========================= */

function filtrar(categoria) {

  if (categoria === "todos") {

    mostrarProductos(
      productos
    );

    return;

  }


  const filtrados =
    productos.filter(
      producto =>
        producto.categoria ===
        categoria
    );


  mostrarProductos(
    filtrados
  );

}


/* =========================
   CARRITO
========================= */

let carrito = [];


function agregarCarrito(
  nombre,
  precio
) {

  const producto =
    carrito.find(
      item =>
        item.nombre ===
        nombre
    );


  if (producto) {

    producto.cantidad++;

  } else {

    carrito.push({

      nombre:
        nombre,

      precio:
        Number(precio),

      cantidad:
        1

    });

  }


  actualizarCarrito();


  alert(
    "Producto agregado 🛒"
  );

}


/* =========================
   ACTUALIZAR CARRITO
========================= */

function actualizarCarrito() {

  const lista =
    document.getElementById(
      "listaCarrito"
    );


  lista.innerHTML = "";


  let total = 0;

  let cantidadTotal = 0;


  carrito.forEach(
    (item, index) => {

      const subtotal =
        item.precio *
        item.cantidad;


      total += subtotal;

      cantidadTotal +=
        item.cantidad;


      lista.innerHTML += `

        <div class="item-carrito">

          <div>

            <strong>
              ${item.nombre}
            </strong>

            <br>

            $${item.precio.toLocaleString(
              "es-AR"
            )}

          </div>


          <div class="cantidad">

            <button
              onclick="cambiarCantidad(
                ${index},
                -1
              )">

              -

            </button>


            ${item.cantidad}


            <button
              onclick="cambiarCantidad(
                ${index},
                1
              )">

              +

            </button>

          </div>


          <button
            class="eliminar"
            onclick="eliminarProducto(
              ${index}
            )">

            🗑️

          </button>

        </div>

      `;

    }
  );


  document.getElementById(
    "total"
  ).textContent =
    total.toLocaleString(
      "es-AR"
    );


  document.getElementById(
    "contador"
  ).textContent =
    cantidadTotal;

}


/* =========================
   CAMBIAR CANTIDAD
========================= */

function cambiarCantidad(
  index,
  cambio
) {

  carrito[index].cantidad +=
    cambio;


  if (
    carrito[index].cantidad <=
    0
  ) {

    carrito.splice(
      index,
      1
    );

  }


  actualizarCarrito();

}


/* =========================
   ELIMINAR PRODUCTO
========================= */

function eliminarProducto(
  index
) {

  carrito.splice(
    index,
    1
  );


  actualizarCarrito();

}


/* =========================
   ABRIR CARRITO
========================= */

function abrirCarrito() {

  document.getElementById(
    "modalCarrito"
  ).style.display =
    "block";


  actualizarCarrito();

}


/* =========================
   CERRAR CARRITO
========================= */

function cerrarCarrito() {

  document.getElementById(
    "modalCarrito"
  ).style.display =
    "none";

}


/* =========================
   WHATSAPP
========================= */

function enviarWhatsApp() {

  if (
    carrito.length ===
    0
  ) {

    alert(
      "El carrito está vacío."
    );

    return;

  }


  let mensaje =
    "Hola Tekno Activa! 👋\n\n";


  mensaje +=
    "Quiero realizar este pedido:\n\n";


  let total = 0;


  carrito.forEach(
    item => {

      const subtotal =
        item.precio *
        item.cantidad;


      total +=
        subtotal;


      mensaje +=
        "📦 " +
        item.nombre +
        " x" +
        item.cantidad +
        " - $" +
        subtotal.toLocaleString(
          "es-AR"
        ) +
        "\n";

    }
  );


  mensaje +=
    "\n💰 TOTAL: $" +
    total.toLocaleString(
      "es-AR"
    );


  window.open(
    "https://wa.me/5492646181163?text=" +
    encodeURIComponent(mensaje),
    "_blank"
  );

}

   MODALES
========================= */

function abrirAdmin() {

  document.getElementById(
    "modalAdmin"
  ).style.display =
    "block";

}


function cerrarAdmin() {

  document.getElementById(
    "modalAdmin"
  ).style.display =
    "none";

}

========================= */

cargarProductos();

cargarBanners();

</script>
